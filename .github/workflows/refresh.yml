name: refresh

# Re-render the profile with fresh numbers every day at midnight Zurich time, and whenever its source changes.
# Cron runs in UTC, and midnight in Zurich is 22:00 UTC in summer (CEST) but 23:00 UTC in winter (CET), so both
# are scheduled and the "when" job lets through only the one that is midnight in Zurich on that date.
on:
  schedule:
    - cron: "0 22 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["profile.toml", "src/**", ".github/workflows/refresh.yml"]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  when:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          go=true
          if [[ "${{ github.event_name }}" == schedule ]]; then
            # Zurich's UTC offset right now: +0200 in summer, +0100 in winter.
            [[ $(TZ=Europe/Zurich date +%z) == +0200 ]] && want="0 22 * * *" || want="0 23 * * *"
            [[ "${{ github.event.schedule }}" == "$want" ]] || go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "Zurich time: $(TZ=Europe/Zurich date '+%F %H:%M %Z'), run: $go"

  render:
    needs: when
    if: needs.when.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools brotli

      # GITHUB_TOKEN sees public data only, which is enough for the contribution calendar (private contributions
      # are shown on the profile) and stars. The language mix needs private repos: add a PROFILE_TOKEN secret
      # (a token with `repo` scope) to refresh it too; without one, the last mix rendered locally is kept.
      - name: Render
        run: python src/build.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}

      - name: Commit if anything changed
        run: |
          git add -A assets data README.md
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Refresh profile numbers"
          git push
