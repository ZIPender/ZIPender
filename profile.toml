# Everything the profile says. Edit this, then run `tools/refresh.sh` (or let the daily Action do it).
# Text in {braces} is filled with live numbers:
#   {contributions} {uptime} {streak} {best_streak} {public_repos}
#   {stars:<repo>} {release:<repo>}                       GitHub (release = latest release tag, without the v)
#   {downloads|followers|version:modrinth/<slug>}         Modrinth
#   {downloads|favorites|version:curseforge/<project id>} CurseForge (the numeric ID from the project's page)
#   {downloads:releases/<owner>/<repo>}                   GitHub: every release file's downloads, added up
#   {downloads:modrinth/<slug>+curseforge/<id>}           a sum; each part can name its own key, as in
#   {followers:modrinth/<slug>+favorites:curseforge/<id>} (a part without a number yet adds nothing)
# A badge, stat or fetch line whose number can't be fetched (and was never cached) is left out.

login = "ZIPender"
user = "zip"
host = "ziparch"
timezone = "Europe/Zurich"   # for the clocks in the prompts
cwd = "~/perso/ZIPender"     # where the header's prompt pretends to be

# fastfetch, as it runs in my Konsole: avatar on the left, these lines on the right.
# An empty list is a blank line. Key colours follow ~/.config/fastfetch/config.jsonc.
[fetch]
lines = [
  ["OS", "Arch Linux x86_64"],
  ["Shell", "zsh + starship"],
  ["Terminal", "Konsole · Obsidian Purple"],
  ["Uptime", "{uptime} on GitHub"],
  [],
  ["Builds", "Minecraft mods · 3DS homebrew · games"],
  ["Langs", "Kotlin · Java · C · TypeScript · C#"],
  ["Commits", "{contributions} in the last year"],
  ["Mods", "{downloads:modrinth/cobblemon_expeditions+curseforge/1470428+curseforge/1722670} downloads, Modrinth + CurseForge"],
]

# Featured projects. The first one gets the wide card; the others share a row.
[[project]]
id = "cobblemon-expeditions"
name = "Cobblemon Expeditions"
dir = "~/perso/Cobblemon_Expeditions"
url = "https://modrinth.com/mod/cobblemon_expeditions"
badge = "v{version:modrinth/cobblemon_expeditions}"
tagline = "Send your Pokémon on timed expeditions for loot, XP and money. Type matchups, IVs and hazards decide how it goes, and the board upgrades in place from Copper to Netherite."
tags = ["Kotlin", "Fabric", "NeoForge", "MC 1.21.1"]
# Modrinth and CurseForge added up; CurseForge's ★ favorites count with Modrinth's followers.
stats = [["md-download", "{downloads:modrinth/cobblemon_expeditions+curseforge/1470428} downloads"], ["fa-heart", "{followers:modrinth/cobblemon_expeditions+favorites:curseforge/1470428} favorites"]]
art = "cobblemon-boards.webp"
icon = "cobblemon-icon.webp"
accent = "#75D6A5"

[[project]]
id = "pkmn-randomizer-3ds"
name = "Pokémon Randomizer 3DS"
dir = "~/perso/3ds-projects"
url = "https://github.com/ZIPender/pkmn-randomizer-3ds"
badge = "v{release:pkmn-randomizer-3ds}"
tagline = "Randomize your Pokémon games on the 3DS itself, offline. 28 games, Gen 1 to 7, with seeds and spoiler logs."
tags = ["C", "3DS homebrew", "citro2d"]
stats = [["md-download", "{downloads:releases/ZIPender/pkmn-randomizer-3ds} downloads"], ["fa-star", "{stars:pkmn-randomizer-3ds} stars"], ["md-nintendo_game_boy", "28 games"]]
art = "3ds"
icon = "randomizer-icon.webp"
accent = "#FF6B81"

[[project]]
id = "shadowbound"
name = "Shadowbound"
dir = "~/perso/Shadowbound"
url = "https://www.curseforge.com/minecraft/mc-mods/shadowbound"
badge = "v{version:curseforge/1722670}"
tagline = "Bind the creatures you slay as Shadows: store them in your Sea Soul, summon them, march them in formations and ride them."
tags = ["Java", "Fabric", "NeoForge", "MC 1.21.1"]
# The first two stats that resolve are shown, so the ranks and formations step in until CurseForge answers.
# Once it is on Modrinth, add +modrinth/<slug> to the downloads and +followers:modrinth/<slug> to the favorites.
stats = [["md-download", "{downloads:curseforge/1722670} downloads"], ["fa-heart", "{favorites:curseforge/1722670} favorites"], ["md-ghost", "7 shadow ranks"], ["md-sword_cross", "9 formations"]]
art = "shadowbound-summon.json"   # the Stone Saint summoned and recalled, made by tools/prepare.py
icon = "shadowbound-icon.webp"
accent = "#BD63FF"

