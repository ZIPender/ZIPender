<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 -40 300 200">
  <!-- Albedo: two black feathers from her wings resting across the frame corner at (210,80),
       a smaller one drifting along the bottom edge, and golden glints (her eyes). -->
  <defs>
    <linearGradient id="vane" gradientUnits="userSpaceOnUse" x1="-16" y1="0" x2="12" y2="0">
      <stop offset="0" stop-color="#0A0612"/>
      <stop offset="0.45" stop-color="#22133A"/>
      <stop offset="0.62" stop-color="#3C2366"/>
      <stop offset="0.78" stop-color="#160C26"/>
      <stop offset="1" stop-color="#07040C"/>
    </linearGradient>
    <linearGradient id="quill" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="-100">
      <stop offset="0" stop-color="#E5BE69"/>
      <stop offset="0.7" stop-color="#D9AE5A"/>
      <stop offset="1" stop-color="#D9AE5A" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="halo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <path id="vaneshape" d="M0.6 -19 C -7 -26 -13 -35 -15 -46 L -9.5 -45 L -15.5 -52
           C -16 -64 -12 -78 -6 -88 L -3 -84 L -3.5 -92 C -1 -96 2 -99 6 -102
           C 8.5 -94 10 -84 10 -74 L 6.5 -72 L 10 -68
           C 10 -50 7 -32 1.4 -19 Z"/>
    <!-- one feather, quill at (0,0), tip near (6,-102) -->
    <g id="feather">
      <use xlink:href="#vaneshape" fill="url(#vane)" stroke="#B48CF2" stroke-opacity="0.8" stroke-width="1"
           stroke-linejoin="round"/>
      <g stroke="#4A2D70" stroke-width="0.7" fill="none">
        <path d="M1 -26 L -8 -33 M1.5 -36 L -11 -45 M2.2 -56 L -12 -64 M3 -68 L -9 -78 M4 -80 L -4 -90"/>
        <path d="M1.2 -30 L 7 -37 M1.8 -44 L 9 -52 M2.6 -60 L 9 -66 M3.6 -78 L 9 -86"/>
      </g>
      <path fill="url(#quill)" d="M -0.9 -8 L 0.9 -8 Q 1.3 -40 3.1 -70 Q 4.5 -88 5.8 -100 Q 4 -88 2.4 -70 Q 0.6 -40 -0.2 -19 L -0.5 -19 Z"/>
    </g>
    <path id="spark" d="M0 -10 C 0.8 -2.5 2.5 -0.8 10 0 C 2.5 0.8 0.8 2.5 0 10 C -0.8 2.5 -2.5 0.8 -10 0 C -2.5 -0.8 -0.8 -2.5 0 -10 Z"/>
  </defs>
  <!-- violet halo so the black feathers read on dark backgrounds -->
  <g filter="url(#halo)" fill="#9B6BFF" opacity="0.7">
    <use xlink:href="#vaneshape" transform="translate(221 93) rotate(-72) scale(1.25)"/>
    <use xlink:href="#vaneshape" transform="translate(223 91) rotate(-20) scale(-0.92 0.92)"/>
    <use xlink:href="#vaneshape" transform="translate(140 112) rotate(-104) scale(0.5)"/>
  </g>
  <use xlink:href="#feather" transform="translate(140 112) rotate(-104) scale(0.5)" opacity="0.9"/>
  <use xlink:href="#feather" transform="translate(223 91) rotate(-20) scale(-0.92 0.92)"/>
  <use xlink:href="#feather" transform="translate(221 93) rotate(-72) scale(1.25)"/>
  <use xlink:href="#spark" transform="translate(252 46) scale(0.95)" fill="#F6D88A" filter="url(#halo)" opacity="0.7"/>
  <use xlink:href="#spark" transform="translate(252 46) scale(0.85)" fill="#FBE6A6"/>
  <use xlink:href="#spark" transform="translate(186 120) scale(0.5)" fill="#F3D27F"/>
</svg>
